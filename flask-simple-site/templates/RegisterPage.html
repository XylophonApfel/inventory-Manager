<!doctype html>
<html lang="de">


<head>
    <title>LOGIN/REGISTER</title>
    <link rel="icon" type="image/x-icon" href="/static/login.png">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>



<body>
<center>
    <a> Steam-Inventar-Manager</a>
    <h1>Login / Register</h1>
<div class="container">
    <div class="form-container">

        <!-- Header -->
        <div class="form-header">
            <h3>Willkommen</h3>
            <p class="subtitle">Bitte gib deine Daten ein</p>
        </div>
        <br>

        <!-- Form -->
        <form class="form-box" action="/login" method="POST">

            <!-- Username -->
            <div class="input-group">
                <input type="text" name="benutzername" id="email" class="input-field" required>
                <label for="email">Benutzername / E-Mail</label>
            </div>

            <!-- Password -->
            <div class="input-group password-group">
                <input type="password" name="passwort" id="password" class="input-field" required>
                <label for="password">Passwort</label>
                <span class="eye-icon">&#128065;</span>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember-me-checkbox">
                    Angemeldet bleiben
                </label>
                <a href="#" class="form-link">Passwort vergessen?</a>
            </div>

            <!-- Button -->
            <button type="submit" class="submit-btn">Anmelden</button>

        </form>

        <!-- Divider -->
        <div class="form-divider">
            <span>ODER</span>
        </div>

        <!-- Signup -->
        <p class="signup-text">
            Noch kein Konto?
            <a href="/register" class="form-link">Registrieren</a>
        </p>

    </div>
</div>
</center>
</body>

</html>
