<!doctype html>
<html lang="de">

<head>
    <title>DASHBOARD</title>
    <link rel="icon" type="image/x-icon" href="/static/dashboard.png">
    <meta charset="utf-8" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>



<body>
<!-- Logout Button -->
<a align="right" href="/logout" class="logout-btn"> Logout </a>

<center>
<a> Steam-Inventar-Manager</a>
</center>

<center>
<!-- Überschrift -->
<h2> Dashboard </h2>
<br>
<br>
</center>

<!-- Container/Felder für Gesamtwert anzeigen -->
<div class="dashboard-wrapper">

  <div class="card card-gesamtwert">
    <div>
      <div class="card-label">Gesamtwert</div>
      <div class="card-value">{{gesamtwert}} €</div>
    </div>
    <div class="card-icon">$</div>
  </div>

  <div class="card card-anzahl">
    <div>
      <div class="card-label">Anzahl Items</div>
      <div class="card-value">{{gesamt_items}}</div>
    </div>
    <div class="card-icon">📦</div>
  </div>

  <div class="card card-gewinn">
    <div>
      <div class="card-label">Gesamtgewinn/verlust</div>
      <div class="card-value">{{gewinn}} €</div>
    </div>
    <div class="card-icon">↗</div>
  </div>

  <div class="card card-performance">
    <div>
      <div class="card-label">Performance</div>
      <div class="card-value">{{gewinn_prozent}} %</div>
    </div>
    <div class="card-icon">〜</div>
  </div>

</div>

<!-- Diagramm -->
<link rel="stylesheet" href="chart.css">

<div class="chart-wrapper">
  <div class="chart-header">
    <div class="chart-title">Statistik</div>
    <select class="chart-dropdown" id="chart-select">
      <option value="kisten">Anzahl der Kisten</option>
      <option value="gesamtwert">Gesamtwert</option>
      <option value="test">Test</option>
      <option value="test1">Test1</option>
    </select>
  </div>
  <div class="chart-canvas-wrapper">
    <canvas id="D1"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="diagramm.js"></script>

<!-- Dropdown Menu für Kisten -->
<form action="/item_hinzufuegen" method="POST">
    
    <label>Wähle eine Kiste aus:</label>
    
    <select name="ausgewaehlte_kiste" class="input-field1">
        
        <option value="Chroma 2 Case">Chroma 2 Case</option>
        <option value="Chroma 3 Case">Chroma 3 Case</option>
        <option value="Chroma Case">Chroma Case</option>
        <option value="Clutch Case">Clutch Case</option>
        <option value="CS20 Case">CS20 Case</option>
        <option value="CS:GO Weapon Case">CS:GO Weapon Case</option>
        <option value="CS:GO Weapon Case 2">CS:GO Weapon Case 2</option>
        <option value="CS:GO Weapon Case 3">CS:GO Weapon Case 3</option>
        <option value="Danger Zone Case">Danger Zone Case</option>
        <option value="Dreams & Nightmares Case">Dreams & Nightmares Case</option>
        <option value="eSports 2013 Case">eSports 2013 Case</option>
        <option value="eSports 2013 Winter Case">eSports 2013 Winter Case</option>
        <option value="eSports 2014 Summer Case">eSports 2014 Summer Case</option>
        <option value="Falchion Case">Falchion Case</option>
        <option value="Fracture Case">Fracture Case</option>
        <option value="Gallery Case">Gallery Case</option>
        <option value="Gamma 2 Case">Gamma 2 Case</option>
        <option value="Gamma Case">Gamma Case</option>
        <option value="Glove Case">Glove Case</option>
        <option value="Horizon Case">Horizon Case</option>
        <option value="Huntsman Weapon Case">Huntsman Weapon Case</option>
        <option value="Kilowatt Case">Kilowatt Case</option>
        <option value="Operation Bravo Case">Operation Bravo Case</option>
        <option value="Operation Breakout Weapon Case">Operation Breakout Weapon Case</option>
        <option value="Operation Hydra Case">Operation Hydra Case</option>
        <option value="Operation Phoenix Weapon Case">Operation Phoenix Weapon Case</option>
        <option value="Operation Vanguard Weapon Case">Operation Vanguard Weapon Case</option>
        <option value="Operation Wildfire Case">Operation Wildfire Case</option>
        <option value="Prisma 2 Case">Prisma 2 Case</option>
        <option value="Prisma Case">Prisma Case</option>
        <option value="Recoil Case">Recoil Case</option>
        <option value="Revolution Case">Revolution Case</option>
        <option value="Revolver Case">Revolver Case</option>
        <option value="Shadow Case">Shadow Case</option>
        <option value="Shattered Web Case">Shattered Web Case</option>
        <option value="Snakebite Case">Snakebite Case</option>
        <option value="Spectrum 2 Case">Spectrum 2 Case</option>
        <option value="Spectrum Case">Spectrum Case</option>
        <option value="Winter Offensive Weapon Case">Winter Offensive Weapon Case</option>

    </select>
    <label for="anzahl">Bitte wähle eine Anzahl:</label>
    <input type="number" id="anzahl" name="anzahl" min="1" max="9999" step="1" value="1">
    <label for="kaufpreis">Kaufpreis (€):</label>
    <input type="number" id="kaufpreis" name="kaufpreis" min="0.01" max="9999" step="0.01" value="1.00">

    <br>
    <br>
    <button align="left" type="submit" class="submit-btn1">Im Diagramm Anzeigen lassen</button>


</form>



</body>

</html>
